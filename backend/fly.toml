# fly.toml app configuration file generated for first-production on 2025-01-19T15:07:05+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-portfolio-ilya'
primary_region = 'fra'

[build]

[env]
  # LLM + embeddings via Gemini's OpenAI-compatible endpoint.
  # The only secret needed: fly secrets set GEMINI_API_KEY=...
  LLM_MODEL = 'gemini-2.5-flash'
  LLM_ROUTER_URL = 'https://generativelanguage.googleapis.com/v1beta/openai/'
  EMBEDDING_MODEL = 'gemini-embedding-001'
  EMBEDDING_API_BASE = 'https://generativelanguage.googleapis.com/v1beta/openai/'
  EMBEDDING_DIMENSIONS = '1536'
  UVICORN_IP = '0.0.0.0'
  UVICORN_PORT = '8080'
  POSTGRES_SERVER="pgvector-db-ilya.flycast"
  POSTGRES_PORT="5432"
  POSTGRES_DB="postgres"
  POSTGRES_USER="postgres"
  FRONTEND_URL='https://www.ilyar.dev,https://ilyar.dev'
  GLOBAL_RATE_LIMIT="1000/hour"
  CHAT_RATE_LIMIT="30/minute"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
